name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the "tim" monorepo: apps/chat (Next.js/Prisma) and
            apps/realtime-server (Socket.IO/Knex) share one Postgres schema,
            owned by apps/chat's prisma/schema.prisma. packages/socket-types
            is the wire contract between the two apps -- new socket events
            belong there first, not hand-added in either app's own hub file.

            Please review this pull request with a focus on:
            - Correctness bugs and edge cases
            - Auth/authorization gaps (every mutation/read should verify
              room or circle/topic membership via the existing model-extension
              or db query helpers, not trust client-supplied ids)
            - Schema/type drift between apps/chat's schema.prisma and any
              hand-rolled Knex query shapes in apps/realtime-server
            - Security implications (secrets, injection, unvalidated input)
            - Real-time lifecycle correctness: socket join/leave/effect
              cleanup is easy to get subtly wrong -- flag anything that looks
              like a listener leak, a race on connect/disconnect, or a missed
              cleanup, but don't suggest rewriting working lifecycle code
              just for style
            - Unnecessary complexity, dead code, or duplicated logic
            - Test coverage: both apps use vitest (apps/chat/src/**/*.test.ts,
              apps/realtime-server/src/**/*.test.ts). If this PR adds new
              non-trivial logic (a new action/route/handler, a new branch in
              existing logic, a new db query/mutation, a new socket event, or
              anything touching auth/authorization or room
              membership/join-leave logic) with no corresponding test, call
              that out specifically as its own comment -- weight
              auth/access-control and room-membership code especially
              heavily here, since a missed check there is a security gap, not
              just a coverage gap. Don't flag trivial changes (config, types,
              formatting, simple prop threading) for lacking tests.

            The list above is what to look for, not something to report on.
            Never restate, summarize, or checklist these categories in a
            comment (e.g. "I checked for auth gaps, test coverage, ..."). Only
            output actual findings -- if a category turned up nothing, say
            nothing about it.

            Note: The PR branch is already checked out in the current working directory.

            Inline comments (`mcp__github_inline_comment__create_inline_comment`,
            with `confirmed: true`):
            - One issue per comment, anchored to the specific line(s) it
              applies to -- don't post a comment spanning or summarizing a
              whole file/hunk when the issue is local to one line.
            - Keep each comment concise and direct: state the problem and,
              if not obvious, the fix, and stop there. Skip preamble like "In
              this section..." or restating what the diff already shows.
            - No praise-only or purely observational comments -- only comment
              where something should change.

            End-of-review summary (required on every review, including
            re-reviews after new commits): after posting inline comments,
            post exactly one top-level `gh pr comment` that gives a verdict.
            Keep it concise, direct, and easy to scan/grep -- a short bullet
            list (one line each, referencing file:line) rather than prose:
            - If there are no issues worth addressing, say so plainly, e.g.
              "Looks good to go."
            - Otherwise, say review is needed before merging and list the
              specific items, not a restatement of the full inline comment
              text.
            This summary comment is mandatory even if you found zero issues.

            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
