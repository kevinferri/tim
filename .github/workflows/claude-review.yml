name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A newer push supersedes an in-flight review of the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the reviewer can diff against what it saw last round.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs. Your main job is to find the
            ways this change breaks: wrong behavior, races, bad state, lost or
            duplicated work. The PR branch is already checked out.

            ## Context
            Read CLAUDE.md, apps/chat/CLAUDE.md and apps/realtime-server/CLAUDE.md
            first. Then read the whole diff (`gh pr diff ${{ github.event.pull_request.number }}`).
            Open every changed file in full, not only the hunks, and follow
            the code it calls and the code that calls it.

            ## Review the whole PR every run
            This may be a re-review. Review the full PR from scratch each time,
            as if no one had looked at it before: bugs often survive several
            rounds because each round only looked at the latest commit. Use
            earlier feedback only to avoid repeating yourself:
            - top-level: `gh pr view ${{ github.event.pull_request.number }} --json comments`
            - inline: `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
            Don't repeat a finding that was fixed, or declined with a reason,
            unless the relevant code has materially changed since.

            ## Step 1: collect candidates broadly
            Go through the change and write down every way it could go wrong.
            Don't filter yet. In particular, trace:
            - State over time: what each value is before, during and after
              every transition, including values that keep their old content
              when something else changes (same length, same index, same key).
            - Ordering: effects vs. paint, timers vs. server updates, async
              writes still in flight when the next request arrives.
            - Entry points other than the happy path: a page load or reconnect
              mid-flow, reduced motion, a second tab, a user leaving and
              returning, a restart or deploy mid-operation, a failed write.
            - Each fix the PR makes: does it hold in every case, or only the
              one it was written for?
            - Authorization: every read and mutation checks circle/topic/room
              membership with the existing helpers; no client-supplied ids are
              trusted.
            - Data: Knex queries in apps/realtime-server match apps/chat's
              schema.prisma, migrations and indexes match the queries, and new
              socket events are defined in packages/socket-types first.

            ## Step 2: verify each candidate
            For each candidate, read the code needed to confirm or disprove
            it: the concrete inputs and sequence of events that trigger it,
            and what the user or the data ends up with. Drop a candidate only
            when the code shows it can't happen. Keep the ones that hold up,
            even if they're subtle or only happen under timing.

            ## Also worth flagging
            - Design: when the approach itself causes problems (polling where
              an event would do, work that grows with all circles or users
              instead of activity, logic in the wrong layer, duplicating an
              existing helper), say so briefly with the simpler alternative.
            - Tests: new non-trivial logic with no tests, especially auth and
              server state. Both apps use vitest with no DOM environment, so
              never ask for component or hook render tests; suggest extracting
              the logic into a plain function instead.

            Skip style, naming, formatting and anything a linter or Prettier
            would catch.

            ## How to write comments
            Each comment must make sense on its own: what's wrong, the
            concrete scenario that triggers it and what happens, and the fix.
            Usually two to four sentences. No preamble, no restating the diff,
            no praise.

            - Bugs: post an inline comment with
              `mcp__github_inline_comment__create_inline_comment`
              (`confirmed: true`), one issue per comment, anchored to the exact
              lines.
            - Design concerns rarely belong to one line. Put them in the
              summary's Design section instead of inline.

            ## Summary comment (required every run)
            Finish with exactly one `gh pr comment`, even when there are no
            findings, in this shape (omit empty sections):

            **Verdict:** No bugs found | Changes needed before merging

            **Must fix**
            - `file:line`: one line

            **Should fix**
            - `file:line`: one line

            **Design**
            - Concern and the suggested alternative (three lines at most)

            Use "Changes needed" when anything is under Must fix. Don't list
            what you checked or explain your process. Only post GitHub
            comments; don't put the review in a message.

          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
